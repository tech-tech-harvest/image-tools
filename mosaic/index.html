<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>モザイク</title>
  <link rel="stylesheet" href="../style.css">
</head>
<body>
  <header class="site-header">
    <div class="site-inner">
      <a class="brand" href="../index.html">ファイル変換ツール</a>
      <nav class="site-nav">
        <a href="../index.html">形式変換</a>
        <a href="../resize/index.html">トリミング＆リサイズ</a>
        <a href="index.html" class="active" aria-current="page">モザイク</a>
        <a href="../bg-remove/index.html">背景削除</a>
      </nav>
    </div>
  </header>

  <div class="page-head">
    <h1>モザイク</h1>
    <p class="sub">写真を選択 → 範囲を指定（図形・ブラシ） → ダウンロード</p>
  </div>

  <div class="layout" id="layout">
    <main class="main-col">
      <!-- 最初の画面：ドロップのみ -->
      <section class="card drop-card" id="step-input">
        <label id="drop-zone" class="drop-zone" for="file-input">
          <input type="file" id="file-input" accept="image/*" hidden>
          <div class="drop-inner">
            <div class="drop-icon">⬆</div>
            <p><strong>ここに写真をドラッグ＆ドロップ</strong></p>
            <p class="muted">または クリックしてファイルを選択</p>
          </div>
        </label>
      </section>

      <!-- 読み込み後：左に画像、右上に編集操作 -->
      <section class="card hidden" id="workspace">
        <div class="pane-head">
          <h2 id="file-info"></h2>
          <div class="info-wrap">
            <button type="button" class="info-btn" aria-label="操作のヒント" aria-expanded="false">i</button>
            <p id="tool-hint" class="info-pop" role="tooltip"></p>
          </div>
        </div>
        <div class="edit-bar">
          <button type="button" id="btn-undo" class="icon-btn" title="元に戻す（⌘Z / Ctrl+Z）" aria-label="元に戻す">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 12a9 9 0 1 0 9-9 9.7 9.7 0 0 0-6.7 2.7L3 8"/><path d="M3 3v5h5"/></svg>
          </button>
          <button type="button" id="btn-redo" class="icon-btn" title="やり直す（⇧⌘Z / Ctrl+Y）" aria-label="やり直す">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12a9 9 0 1 1-9-9 9.7 9.7 0 0 1 6.7 2.7L21 8"/><path d="M21 3v5h-5"/></svg>
          </button>
          <button type="button" id="btn-clear" class="btn secondary with-icon">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 6h18"/><path d="M8 6V4h8v2"/><path d="m19 6-1 14H6L5 6"/><path d="M10 11v6M14 11v6"/></svg>すべて解除
          </button>
          <div class="bar-right">
            <div class="view-switch" role="tablist">
              <button type="button" role="tab" data-view="edit" class="active">編集</button>
              <button type="button" role="tab" data-view="original">元画像</button>
            </div>
          </div>
        </div>
        <div class="crop-area">
          <div id="stage" class="mosaic-stage">
            <canvas id="view"></canvas>
            <canvas id="overlay"></canvas>
          </div>
        </div>
      </section>
    </main>

    <!-- モザイク設定（サイドバー） -->
    <aside class="side card hidden" id="side">
      <div class="side-head">
        <h2>モザイク設定</h2>
      </div>

      <div class="file-tabs" role="radiogroup" aria-label="範囲の決め方">
        <label><input type="radio" name="tool" value="shape" checked>図形から</label>
        <label><input type="radio" name="tool" value="brush">ブラシ</label>
      </div>

      <div class="side-body file-panel">
        <div class="tab-content">
          <div id="shape-fields">
            <div class="opt">
              <div class="opt-title">形 <span class="muted small">（画像の上へドラッグして追加）</span></div>
              <select id="shape-type" hidden>
                <option value="rect">四角</option>
                <option value="ellipse">楕円</option>
              </select>
              <div class="shape-palette" id="shape-palette">
                <button type="button" class="shape-tile" data-shape="rect"><span class="shape-icon rect"></span>四角</button>
                <button type="button" class="shape-tile" data-shape="ellipse"><span class="shape-icon ellipse"></span>楕円</button>
              </div>
            </div>
          </div>

          <div id="brush-fields" class="hidden">
            <select id="paint-mode" hidden>
              <option value="add">かける</option>
              <option value="erase">消す</option>
            </select>
            <div class="round-tools" role="radiogroup" aria-label="ブラシの操作">
              <button type="button" class="round-tool" data-mode="add" role="radio" title="かける" aria-label="かける">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20l1-4.5L16 4.5a2.1 2.1 0 0 1 3 3L8 18.5Z"/><path d="M14 6.5l3 3"/><path d="M13 20h7"/></svg>
              </button>
              <button type="button" class="round-tool" data-mode="erase" role="radio" title="消す" aria-label="消す">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8.5 20 3.7 15.2a1.5 1.5 0 0 1 0-2.1l9.4-9.4a1.5 1.5 0 0 1 2.1 0l5.1 5.1a1.5 1.5 0 0 1 0 2.1L11.5 20Z"/><path d="m8 10 6.5 6.5"/><path d="M8.5 20H20"/></svg>
              </button>
            </div>
            <div class="opt">
              <div class="opt-title">ブラシの太さ <span class="opt-value"><span id="brush-val">40</span> px</span></div>
              <input type="range" id="brush" min="5" max="200" step="1" value="40">
            </div>
          </div>
        </div>

        <div class="opt">
          <div class="opt-title">効果</div>
          <select id="effect" class="seg">
            <option value="mosaic">モザイク</option>
            <option value="blur">ぼかし</option>
          </select>
        </div>

        <div class="opt" id="block-row">
          <div class="opt-title">粗さ <span class="opt-value">1マス <span id="block-val">10</span> px</span></div>
          <input type="range" id="block" min="2" max="100" step="1" value="10">
        </div>

        <div class="opt hidden" id="blur-row">
          <div class="opt-title">ぼかしの強さ <span class="opt-value"><span id="blur-val">10</span></span></div>
          <input type="range" id="blur" min="2" max="100" step="1" value="10">
        </div>
      </div>

      <div class="side-actions">
        <button type="button" id="btn-download" class="btn primary block">ダウンロード</button>
        <button type="button" id="btn-new" class="btn secondary block">別の写真を選ぶ</button>
      </div>
    </aside>
  </div>

  <script src="../segmented.js"></script>
  <script src="app.js"></script>
</body>
</html>
