<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>写真トリミング＆リサイズ</title>
  <link rel="stylesheet" href="../style.css">
</head>
<body>
  <header class="site-header">
    <div class="site-inner">
      <a class="brand" href="../index.html">画像ツール</a>
      <nav class="site-nav"></nav>
    </div>
  </header>
  <script src="../nav.js"></script>

  <div class="page-head">
    <h1>写真トリミング＆リサイズ</h1>
    <p class="sub">写真を選択 → 出力サイズを指定 → 切り取り範囲を調整 → ダウンロード</p>
  </div>

  <div class="layout" id="layout">
    <main class="main-col">
      <!-- 最初の画面：ドロップのみ -->
      <section class="card drop-card" id="step-input">
        <label id="drop-zone" class="drop-zone" for="file-input">
          <input type="file" id="file-input" accept="image/*" hidden>
          <div class="drop-inner">
            <div class="drop-icon">⬆</div>
            <p><strong>ここに写真をドラッグ＆ドロップ</strong></p>
            <p class="muted">または クリックしてファイルを選択</p>
          </div>
        </label>
      </section>

      <!-- 読み込み後：右上のタブで「編集」と「プレビュー」を切り替える -->
      <section class="card hidden" id="workspace">
        <div class="pane-head">
          <h2 id="file-info"></h2>
          <div class="info-wrap">
            <button type="button" class="info-btn" aria-label="操作のヒント" aria-expanded="false">i</button>
            <p id="crop-hint" class="info-pop" role="tooltip">枠をドラッグで移動、四隅をドラッグで拡大・縮小（比率は固定）</p>
          </div>
        </div>
        <div class="edit-bar">
          <button type="button" id="btn-new" class="btn secondary with-icon">
            <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="9" cy="10" r="2"/><path d="m21 16-5-5-9 9"/></svg>別の写真を選ぶ
          </button>
          <div class="bar-right">
            <div class="view-switch" role="tablist">
              <button type="button" role="tab" data-view="edit" class="active">編集</button>
              <button type="button" role="tab" data-view="preview">プレビュー</button>
            </div>
          </div>
        </div>

        <div id="view-edit">
          <div class="crop-area">
            <div id="stage" class="stage">
              <img id="src-img" alt="" draggable="false">
              <div id="crop-box" class="crop-box">
                <div class="grid"></div>
                <div class="handle nw" data-handle="nw"></div>
                <div class="handle ne" data-handle="ne"></div>
                <div class="handle sw" data-handle="sw"></div>
                <div class="handle se" data-handle="se"></div>
                <div class="handle edge n" data-handle="n"></div>
                <div class="handle edge s" data-handle="s"></div>
                <div class="handle edge e" data-handle="e"></div>
                <div class="handle edge w" data-handle="w"></div>
              </div>
            </div>
          </div>
          <canvas id="loupe" class="loupe hidden"></canvas>
          <div class="crop-tools">
            <span id="crop-info" class="muted small"></span>
            <button type="button" id="btn-reset" class="btn secondary">枠をリセット</button>
          </div>
        </div>

        <div id="view-preview" class="hidden">
          <div class="preview-wrap">
            <canvas id="preview"></canvas>
          </div>
        </div>
        <p id="output-info" class="muted small center"></p>
      </section>
    </main>

    <!-- 出力設定（サイドバー） -->
    <aside class="side card hidden" id="step-settings">
      <div class="side-head">
        <h2>出力設定</h2>
      </div>

      <div class="file-tabs" role="radiogroup" aria-label="サイズの決め方">
        <label><input type="radio" name="mode" value="free" checked>自由</label>
        <label><input type="radio" name="mode" value="pixel">ピクセル</label>
        <label><input type="radio" name="mode" value="ratio">縦横比</label>
      </div>

      <div class="side-body file-panel">
        <div class="tab-content">
          <div id="pixel-fields" class="px-panel">
            <label class="px-label" for="size-preset">よく使うサイズ</label>
            <select id="size-preset" class="dd">
              <option value="custom">自分で入力</option>
              <option value="1080x1080" selected>Instagram 正方形（1080×1080）</option>
              <option value="1080x1350">Instagram 縦長（1080×1350）</option>
              <option value="1080x1920">ストーリー・縦動画（1080×1920）</option>
              <option value="1280x720">YouTube サムネイル（1280×720）</option>
              <option value="1500x500">X ヘッダー（1500×500）</option>
              <option value="400x400">アイコン（400×400）</option>
              <option value="1920x1080">フルHD（1920×1080）</option>
              <option value="354x472">証明写真 3×4cm（354×472）</option>
            </select>

            <div class="px-fields">
              <label class="px-field">
                <span class="px-label">幅</span>
                <span class="px-input"><input type="number" id="out-w" min="1" step="1" value="1080" inputmode="numeric"><span>px</span></span>
              </label>
              <button type="button" id="swap-wh" class="icon-btn px-swap" title="幅と高さを入れ替える（縦長 ⇄ 横長）" aria-label="幅と高さを入れ替える">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 7h12l-3-3"/><path d="M17 17H5l3 3"/></svg>
              </button>
              <label class="px-field">
                <span class="px-label">高さ</span>
                <span class="px-input"><input type="number" id="out-h" min="1" step="1" value="1080" inputmode="numeric"><span>px</span></span>
              </label>
            </div>

            <p id="px-info" class="px-info"></p>
          </div>

          <div id="ratio-fields" class="px-panel hidden">
            <label class="px-label" for="ratio-preset">よく使う比率</label>
            <select id="ratio-preset" class="dd">
              <option value="original" selected>元の写真と同じ</option>
              <option value="1:1">1:1 正方形</option>
              <option value="4:3">4:3 スマホの写真（横）</option>
              <option value="3:4">3:4 スマホの写真（縦）</option>
              <option value="3:2">3:2 カメラの写真（横）</option>
              <option value="2:3">2:3 カメラの写真（縦）</option>
              <option value="16:9">16:9 ワイド・動画</option>
              <option value="9:16">9:16 縦動画・ストーリー</option>
              <option value="4:5">4:5 Instagram 縦長</option>
              <option value="custom">自分で入力</option>
            </select>

            <div class="px-fields">
              <label class="px-field">
                <span class="px-label">横</span>
                <span class="px-input no-unit"><input type="number" id="ratio-w" min="0.01" step="any" value="4" inputmode="decimal"></span>
              </label>
              <button type="button" id="swap-ratio" class="icon-btn px-swap" title="横と縦を入れ替える（縦長 ⇄ 横長）" aria-label="横と縦を入れ替える">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 7h12l-3-3"/><path d="M17 17H5l3 3"/></svg>
              </button>
              <label class="px-field">
                <span class="px-label">縦</span>
                <span class="px-input no-unit"><input type="number" id="ratio-h" min="0.01" step="any" value="3" inputmode="decimal"></span>
              </label>
            </div>

            <p id="ratio-info" class="px-info"></p>
          </div>

          <p id="free-note" class="muted small hidden">切り取り範囲をマウスで自由に指定します。出力は切り取った範囲の元の解像度のまま保存されます。</p>
        </div>

        <div class="opt" id="shape-opt">
          <div class="opt-title">切り抜く形</div>
          <div class="shape-choices" role="radiogroup" aria-label="切り抜く形">
            <label class="shape-choice"><input type="radio" name="shape" value="rect" checked><span class="shape-ico rect"></span>四角</label>
            <label class="shape-choice"><input type="radio" name="shape" value="round"><span class="shape-ico round"></span>角丸</label>
            <label class="shape-choice"><input type="radio" name="shape" value="circle"><span class="shape-ico circle"></span>円</label>
          </div>
          <div id="radius-row" class="hidden">
            <div class="opt-title">角の丸み <span class="opt-value"><span id="radius-val">20</span>%</span></div>
            <input type="range" id="radius" min="5" max="50" step="1" value="20">
          </div>
          <div id="shape-note" class="shape-note hidden">
            <p class="muted small">形の外側は透明になります（PNG で保存）。</p>
            <button type="button" id="make-circle" class="btn secondary block with-icon">
              <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8"/></svg>正円にする（枠を正方形に）
            </button>
          </div>
        </div>

        <!-- ピクセル指定のときは幅・高さで決まるので出さない -->
        <div class="opt" id="size-opt">
          <div class="opt-title">ファイルの重さ</div>
          <div class="grid2">
            <select id="size-mode" class="dd">
              <option value="keep" selected>そのまま</option>
              <option value="limit">上限を指定</option>
            </select>
          </div>
          <!-- 「上限を指定」のときだけ出す：数値＋単位 -->
          <div id="size-input" class="size-input hidden">
            <input type="number" id="size-value" min="0" step="any" value="500" inputmode="decimal" aria-label="重さの上限">
            <select id="size-unit" class="dd" aria-label="単位">
              <option value="1">B</option>
              <option value="1000" selected>KB</option>
              <option value="1000000">MB</option>
              <option value="1000000000">GB</option>
            </select>
            <span>以下</span>
          </div>
          <p class="muted small opt-note size-note">上限を指定すると、その重さ以下になるよう画質を自動で下げます（PNG の画像は JPEG、角丸・円のときは WebP で保存）。</p>
        </div>
      </div>

      <div class="side-actions">
        <!-- 保存される画像の要約 -->
        <div class="out-summary" aria-live="polite">
          <div><span>大きさ</span><strong id="sum-dim">—</strong></div>
          <div><span>縦横比</span><strong id="sum-ratio">—</strong></div>
          <div><span id="sum-format">ファイル</span><strong id="sum-size">—</strong></div>
        </div>
        <p id="save-result" class="muted small center"></p>
        <button type="button" id="btn-download" class="btn primary block">ダウンロード</button>
      </div>
    </aside>
  </div>

  <script src="../segmented.js"></script>
  <script src="app.js"></script>
</body>
</html>
