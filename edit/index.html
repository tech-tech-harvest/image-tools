<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>画像編集</title>
  <link rel="stylesheet" href="../style.css">
</head>
<body>
  <header class="site-header">
    <div class="site-inner">
      <a class="brand" href="../index.html">画像ツール</a>
      <nav class="site-nav"></nav>
    </div>
  </header>
  <script src="../nav.js"></script>

  <div class="page-head">
    <h1>画像編集</h1>
    <p class="sub">明るさやフィルタの調整、文字・手書きの書き込み、回転やトリミングができます。ファイルは外部に送信されません</p>
  </div>

  <div class="layout" id="layout">
    <main class="main-col">
      <!-- 最初の画面：ドロップのみ -->
      <section class="card drop-card" id="step-input">
        <label id="drop-zone" class="drop-zone" for="file-input">
          <input type="file" id="file-input" accept="image/*" hidden>
          <div class="drop-inner">
            <div class="drop-icon">⬆</div>
            <p><strong>ここに写真をドラッグ＆ドロップ</strong></p>
            <p class="muted">または クリックしてファイルを選択</p>
          </div>
        </label>
      </section>

      <!-- 読み込み後：左に画像 -->
      <section class="card hidden" id="workspace">
        <div class="pane-head">
          <h2 id="file-info"></h2>
          <div class="info-wrap">
            <button type="button" class="info-btn" aria-label="操作のヒント" aria-expanded="false">i</button>
            <p id="tool-hint" class="info-pop" role="tooltip"></p>
          </div>
        </div>
        <div class="edit-bar">
          <button type="button" id="btn-new" class="btn secondary with-icon">
            <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="9" cy="10" r="2"/><path d="m21 16-5-5-9 9"/></svg>別の写真を選ぶ
          </button>
          <span class="bar-divider" aria-hidden="true"></span>
          <button type="button" id="btn-undo" class="icon-btn" title="元に戻す（⌘Z / Ctrl+Z）" aria-label="元に戻す">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 12a9 9 0 1 0 9-9 9.7 9.7 0 0 0-6.7 2.7L3 8"/><path d="M3 3v5h5"/></svg>
          </button>
          <button type="button" id="btn-redo" class="icon-btn" title="やり直す（⇧⌘Z / Ctrl+Y）" aria-label="やり直す">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12a9 9 0 1 1-9-9 9.7 9.7 0 0 1 6.7 2.7L21 8"/><path d="M21 3v5h-5"/></svg>
          </button>
          <button type="button" id="btn-reset-all" class="btn secondary with-icon">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 6h18"/><path d="M8 6V4h8v2"/><path d="m19 6-1 14H6L5 6"/><path d="M10 11v6M14 11v6"/></svg>すべて元に戻す
          </button>
          <div class="bar-right">
            <div class="view-switch" role="tablist">
              <button type="button" role="tab" data-view="edit" class="active">編集</button>
              <button type="button" role="tab" data-view="original">元画像</button>
            </div>
          </div>
        </div>
        <div class="crop-area">
          <div id="stage" class="mosaic-stage edit-stage">
            <canvas id="view"></canvas>
            <canvas id="overlay"></canvas>
          </div>
        </div>
      </section>
    </main>

    <!-- 編集の道具（サイドバー） -->
    <aside class="side card hidden" id="side">
      <div class="side-head">
        <h2>画像編集</h2>
      </div>

      <div class="file-tabs tool-tabs" role="radiogroup" aria-label="道具">
        <label><input type="radio" name="tool" value="adjust" checked>
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h10M18 6h2M4 12h4M12 12h8M4 18h12M20 18h0"/><circle cx="16" cy="6" r="2"/><circle cx="10" cy="12" r="2"/><circle cx="18" cy="18" r="2"/></svg>調整</label>
        <label><input type="radio" name="tool" value="filter">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="9" cy="9" r="5"/><circle cx="15" cy="9" r="5"/><circle cx="12" cy="15" r="5"/></svg>フィルタ</label>
        <label><input type="radio" name="tool" value="text">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 6V4h14v2"/><path d="M12 4v16"/><path d="M9 20h6"/></svg>文字</label>
        <label><input type="radio" name="tool" value="pen">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20l1-4.5L16 4.5a2.1 2.1 0 0 1 3 3L8 18.5Z"/><path d="M14 6.5l3 3"/></svg>ペン</label>
        <label><input type="radio" name="tool" value="crop">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 2v14a2 2 0 0 0 2 2h14"/><path d="M18 22V8a2 2 0 0 0-2-2H2"/></svg>トリミング</label>
      </div>

      <div class="side-body file-panel">
        <div class="tab-content">
          <!-- 調整 -->
          <div id="panel-adjust" class="tool-panel">
            <div class="adj">
              <div class="opt-title">明るさ <span class="opt-value" id="v-brightness">0</span></div>
              <input type="range" data-adj="brightness" min="-100" max="100" step="1" value="0">
            </div>
            <div class="adj">
              <div class="opt-title">コントラスト <span class="opt-value" id="v-contrast">0</span></div>
              <input type="range" data-adj="contrast" min="-100" max="100" step="1" value="0">
            </div>
            <div class="adj">
              <div class="opt-title">彩度 <span class="opt-value" id="v-saturation">0</span></div>
              <input type="range" data-adj="saturation" min="-100" max="100" step="1" value="0">
            </div>
            <div class="adj">
              <div class="opt-title">色温度 <span class="opt-value" id="v-temperature">0</span></div>
              <input type="range" data-adj="temperature" min="-100" max="100" step="1" value="0">
              <div class="range-ends"><span>青っぽく</span><span>黄色っぽく</span></div>
            </div>
            <button type="button" id="adjust-reset" class="btn secondary block">調整を元に戻す</button>
          </div>

          <!-- フィルタ -->
          <div id="panel-filter" class="tool-panel hidden">
            <div id="filter-grid" class="filter-grid"></div>
            <div id="filter-strength-row" class="adj hidden">
              <div class="opt-title">強さ <span class="opt-value"><span id="v-strength">100</span>%</span></div>
              <input type="range" id="filter-strength" min="0" max="100" step="1" value="100">
            </div>
          </div>

          <!-- 文字 -->
          <div id="panel-text" class="tool-panel hidden">
            <button type="button" id="text-add" class="btn secondary block with-icon action-btn">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg><span>文字を追加</span>
            </button>
            <div id="text-props" class="hidden">
              <div class="opt-title">文字</div>
              <textarea id="text-input" class="text-input" rows="2" aria-label="文字の内容"></textarea>
              <div class="opt-title">大きさ
                <label class="opt-value num-field"><input type="number" id="text-size-num" min="8" max="5000" step="1" value="60" inputmode="numeric" aria-label="文字の大きさ（px）"> px</label>
              </div>
              <input type="range" id="text-size" min="8" max="400" step="1" value="60">
              <div class="opt-title">色</div>
              <div id="text-colors" class="color-swatches"></div>
              <div class="toggle-row">
                <label class="toggle-chip"><input type="checkbox" id="text-bold">太字</label>
                <label class="toggle-chip"><input type="checkbox" id="text-stroke">縁取り</label>
                <label class="toggle-chip"><input type="checkbox" id="text-band">背景の帯</label>
              </div>
            </div>
            <p id="text-note" class="muted small opt-note">「文字を追加」を押すと、画像の真ん中に文字が入ります。</p>
          </div>

          <!-- ペン -->
          <div id="panel-pen" class="tool-panel hidden">
            <select id="pen-mode" hidden>
              <option value="draw">描く</option>
              <option value="erase">消す</option>
            </select>
            <div class="round-tools" role="radiogroup" aria-label="ペンの操作">
              <button type="button" class="round-tool" data-mode="draw" role="radio" title="描く" aria-label="描く">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20l1-4.5L16 4.5a2.1 2.1 0 0 1 3 3L8 18.5Z"/><path d="M14 6.5l3 3"/><path d="M13 20h7"/></svg>
              </button>
              <button type="button" class="round-tool" data-mode="erase" role="radio" title="消す（ペンで描いた線だけ）" aria-label="消す">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8.5 20 3.7 15.2a1.5 1.5 0 0 1 0-2.1l9.4-9.4a1.5 1.5 0 0 1 2.1 0l5.1 5.1a1.5 1.5 0 0 1 0 2.1L11.5 20Z"/><path d="m8 10 6.5 6.5"/><path d="M8.5 20H20"/></svg>
              </button>
            </div>
            <div id="pen-color-row">
              <div class="opt-title">色</div>
              <div id="pen-colors" class="color-swatches"></div>
            </div>
            <div class="opt-title">太さ <span class="opt-value"><span id="v-pen-size">8</span> px</span></div>
            <input type="range" id="pen-size" min="2" max="60" step="1" value="8">
            <button type="button" id="pen-clear" class="btn secondary block pen-clear">ペンの線をすべて消す</button>
          </div>

          <!-- トリミング・回転 -->
          <div id="panel-crop" class="tool-panel hidden">
            <div class="opt-title">回転・反転</div>
            <div class="icon-row">
              <button type="button" id="rot-left" class="icon-btn" title="左に90°回転" aria-label="左に90°回転">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 12a9 9 0 1 0 9-9 9.7 9.7 0 0 0-6.7 2.7L3 8"/><path d="M3 3v5h5"/></svg>
              </button>
              <button type="button" id="rot-right" class="icon-btn" title="右に90°回転" aria-label="右に90°回転">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12a9 9 0 1 1-9-9 9.7 9.7 0 0 1 6.7 2.7L21 8"/><path d="M21 3v5h-5"/></svg>
              </button>
              <button type="button" id="flip-h" class="icon-btn" title="左右反転" aria-label="左右反転">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v18"/><path d="M8 7 3 12l5 5V7Z"/><path d="M16 7l5 5-5 5V7Z"/></svg>
              </button>
              <button type="button" id="flip-v" class="icon-btn" title="上下反転" aria-label="上下反転">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 12h18"/><path d="M7 8l5-5 5 5H7Z"/><path d="M7 16l5 5 5-5H7Z"/></svg>
              </button>
            </div>
            <div class="adj">
              <div class="opt-title">傾きの補正 <span class="opt-value"><span id="v-straighten">0</span>°</span></div>
              <input type="range" id="straighten" min="-45" max="45" step="0.5" value="0">
            </div>
            <div class="opt-title">トリミング</div>
            <p class="muted small opt-note">画像の枠の角や辺をドラッグして、残す範囲を決めます。中をドラッグすると移動できます。</p>
            <button type="button" id="crop-reset" class="btn secondary block">トリミングを元に戻す</button>
          </div>
        </div>
      </div>

      <div class="side-actions">
        <div class="out-summary" aria-live="polite">
          <div><span>大きさ</span><strong id="sum-dim">—</strong></div>
          <div><span>縦横比</span><strong id="sum-ratio">—</strong></div>
          <div><span id="sum-format">ファイル</span><strong id="sum-size">—</strong></div>
        </div>
        <p id="save-result" class="muted small center"></p>
        <button type="button" id="btn-download" class="btn primary block">ダウンロード</button>
      </div>
    </aside>
  </div>

  <script src="../segmented.js"></script>
  <script src="app.js"></script>
</body>
</html>
